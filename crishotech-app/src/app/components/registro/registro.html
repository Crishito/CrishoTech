<section class="pt-32 pb-20 bg-gray-100 min-h-screen">
  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
    <div class="p-8">

      <div class="flex justify-center mb-8">
        <div class="inline-flex rounded-lg bg-gray-100 p-1">
          <button
            routerLink="/login"
            class="px-6 py-2 rounded-md text-gray-500 font-bold hover:text-blue-600 transition">
            Login
          </button>

          <button
            type="button"
            class="px-6 py-2 rounded-md bg-white shadow-sm font-bold text-blue-600 transition">
            Registro
          </button>
        </div>
      </div>

      <form
        class="space-y-4"
        (submit)="registrarUsuario($event)"
        (keydown)="atajoRegistrar($event)"
        novalidate>

        <h2 class="text-2xl font-bold text-gray-800 text-center">
          Crea tu cuenta
        </h2>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Nombre</label>

            <input
              type="text"
              [(ngModel)]="nombre"
              name="nombre"
              (input)="validarNombreEnTiempoReal()"
              class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-500 focus:ring-2 focus:ring-blue-500 outline-none">

            @if (errorNombre) {
              <p class="text-red-500 text-xs mt-1">{{ errorNombre }}</p>
            }
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Apellido</label>

            <input
              type="text"
              [(ngModel)]="apellido"
              name="apellido"
              (input)="validarApellidoEnTiempoReal()"
              class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-500 focus:ring-2 focus:ring-blue-500 outline-none">

            @if (errorApellido) {
              <p class="text-red-500 text-xs mt-1">{{ errorApellido }}</p>
            }
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>

          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            (input)="validarEmailEnTiempoReal()"
            class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-500 focus:ring-2 focus:ring-blue-500 outline-none">

          @if (errorEmail) {
            <p class="text-red-500 text-xs mt-1">{{ errorEmail }}</p>
          }
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Contraseña</label>

          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            (keyup)="validarPasswordEnTiempoReal()"
            class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-500 focus:ring-2 focus:ring-blue-500 outline-none">

          @if (errorPassword) {
            <p class="text-red-500 text-xs mt-1">{{ errorPassword }}</p>
          }
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 py-4 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition">
          Registrarse
        </button>

      </form>

    </div>
  </div>
</section>
